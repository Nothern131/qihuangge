    /* ========== 分享引导功能 ========== */
    function toggleShareGuide() {
        var body = document.getElementById('shareBody');
        var arrow = document.getElementById('shareArrow');
        if (!body || !arrow) return;
        var isHidden = body.style.display === 'none' || body.style.display === '';
        body.style.display = isHidden ? 'block' : 'none';
        arrow.textContent = isHidden ? '▲' : '▼';
        // 记住状态
        try { localStorage.setItem('shareGuideOpen', isHidden ? '1' : '0'); } catch(e) {}
    }
    function copyAppLink() {
        var url = window.location.href.split('#')[0] || window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function() {
                var btn = document.querySelector('.copy-link-btn');
                if (btn) { btn.textContent = '✅ 已复制'; setTimeout(function() { btn.textContent = '📋 复制链接'; }, 2000); }
            }).catch(function() { fallbackCopy(url); });
        } else { fallbackCopy(url); }
    }
    function fallbackCopy(url) {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); var btn = document.querySelector('.copy-link-btn'); if (btn) { btn.textContent = '✅ 已复制'; setTimeout(function() { btn.textContent = '📋 复制链接'; }, 2000); } } catch(e) { alert('复制失败，请手动复制链接：' + url); }
        document.body.removeChild(ta);
    }
    /* ========== 恢复分享引导状态 ========== */
    document.addEventListener('DOMContentLoaded', function() {
        try {
            var saved = localStorage.getItem('shareGuideOpen');
            if (saved === '0') {
                var body = document.getElementById('shareBody');
                var arrow = document.getElementById('shareArrow');
                if (body) body.style.display = 'none';
                if (arrow) arrow.textContent = '▼';
            }
        } catch(e) {}
    });
    /* ========== Service Worker 注册 ========== */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
                console.log('[岐黄阁] SW注册成功，scope:', reg.scope);
            }, function(err) {
                console.log('[岐黄阁] SW注册失败:', err);
            });
        });
    }
    </script>
